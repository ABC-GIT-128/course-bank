name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # 安全回归：恶意标题/题目不得以可执行形式进入产物
      - name: 安全回归测试
        run: node scripts/test-security.js

      # 部署前重建索引并校验：宁可这次不发布，也不要把坏数据推上线
      # 注意：data/courses.js 是产物、不入库，就是在这里现生成的
      - name: 校验数据
        run: |
          node scripts/build-index.js
          node scripts/check-data.js

      - name: 构建静态站点
        run: |
          mkdir -p .build
          # 只发布运行时需要的文件；脚本、授权凭证、说明文档不进产物
          # PWA：manifest + service worker 必须在根目录
          cp -r index.html quiz.html about.html batch.html assets data templates .build/
          cp manifest.webmanifest sw.js .build/
          # 课程短地址：/sensor/ —— 由 build-index.js 生成，只带标记的目录才拷
          for d in */; do
            if [ -f "$d/index.html" ] && grep -q "oc-course-route" "$d/index.html"; then
              cp -r "$d" .build/
              echo "route: $d"
            fi
          done

      # 真正删除下架内容：下架课程的 data 文件不进产物，短地址页换成静态提示页
      - name: 裁剪下架内容
        run: node scripts/prune-build.js .build

      # 给静态资源加版本号：穿透浏览器与 Service Worker 缓存
      - name: 加缓存版本号
        run: node scripts/stamp-version.js .build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
