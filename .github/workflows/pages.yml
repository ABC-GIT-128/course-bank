name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 部署前再校验一次：宁可这次不发布，也不要把坏数据推上线
      - name: 校验数据
        run: |
          node scripts/build-index.js
          node scripts/check-data.js

      - name: 构建静态站点
        run: |
          mkdir -p .build
          # 只发布运行时需要的文件；脚本、授权凭证、说明文档不进产物
          # PWA：manifest + service worker 必须在根目录
          cp -r index.html quiz.html about.html assets data templates .build/
          cp manifest.webmanifest sw.js .build/
          # 课程短地址：/sensor/ —— 由 build-index.js 生成，只带标记的目录才拷
          for d in */; do
            if [ -f "$d/index.html" ] && grep -q "oc-course-route" "$d/index.html"; then
              cp -r "$d" .build/
              echo "route: $d"
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
