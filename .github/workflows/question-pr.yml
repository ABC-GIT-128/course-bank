name: 投稿自动入库

# 流程：
#   1) 同学用「新增题目」模板提 Issue（手机就能填）
#   2) 本工作流自动回帖：已收到，等待审核
#   3) 维护者打上 approved 标签 → 自动解析、写数据、校验、开 PR
#   4) 维护者合并 PR → 页面更新
#
# 为什么不在 issue 打开时直接生成：审核权必须由人掌握，
# 打标签这一步就是「人工放行」，避免有人用投稿通道塞垃圾内容。

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ---------- 兜底打标：没用模板、正文却是题目的，自动补标签 ----------
  triage:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const names = (issue.labels || []).map(l => l.name);
            if (names.includes('contribution')) { core.info('已有投稿标签，跳过'); return; }
            const looksLikeQuestions = /【\s*(选择|填空|名词|计算|名词解释)/.test(body);
            if (!looksLikeQuestions) { core.info('正文不像题目，跳过'); return; }

            const hasCourse = /(所属课程|课程\s*[:：]\s*[A-Za-z0-9_-]+)/.test(body);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['contribution', 'batch', 'question']
            });
            const tips = [
              '这条 Issue 看起来是题目内容，但我没检测到投稿标签，已自动补上 `contribution` / `batch` / `question`。',
              '',
              hasCourse
                ? '下一步：维护者核对后加 `approved` 标签，系统会自动生成 PR，合并后才会上线。'
                : '**还缺「所属课程」**：请在本条 Issue 里补一行，例如 `所属课程：sensor`，否则自动入库不知道往哪门课里放。',
              '',
              '提醒：**提交 Issue ≠ 上线**。要经过「维护者打 approved → 生成 PR → 合并」三步，页面才会出现新题。'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: tips
            });

  # ---------- 收到投稿：自动回帖告知下一步 ----------
  ack:
    if: contains(github.event.issue.labels.*.name, 'contribution') && (github.event.action == 'opened' || github.event.label.name == 'contribution')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            /* 同一 Issue 只回一次，避免「新建即带标签」时重复评论 */
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            if (comments.some(c => (c.body || '').includes('已收到这条投稿'))) {
              core.info('已经回过帖了，跳过');
              return;
            }
            const labels = (context.payload.issue.labels || []).map(l => l.name);
            const isQ = labels.includes('question');
            const body = [
              '已收到这条投稿，谢谢！',
              '',
              isQ
                ? '接下来：维护者会核对答案、解析与出处（通常 1–3 天），通过后自动生成 PR 并合入。'
                : '接下来：维护者会联系你确认资料来源与授权情况，再决定是否建课。',
              '',
              '如果哪里填错了，直接在本条 Issue 里补充说明即可，不用重新提交。'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ---------- 审核通过：生成 PR ----------
  generate:
    if: github.event.action == 'labeled' && github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'contribution')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: 解析投稿内容
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          mkdir -p .tmp
          printf '%s' "$ISSUE_BODY" > .tmp/issue.md
          set +e
          if echo ",$LABELS," | grep -q ",batch,"; then
            echo "→ 批量投稿"
            node scripts/parse-batch.js --body-file .tmp/issue.md \
                 --issue-number "$ISSUE_NUMBER" --issue-title "$ISSUE_TITLE" \
                 --out .tmp/batch.json > .tmp/parse.log 2>&1
          else
            echo "→ 单题投稿"
            node scripts/issue-parse.js --body-file .tmp/issue.md \
                 --issue-number "$ISSUE_NUMBER" --out .tmp/q.json > .tmp/parse.log 2>&1
          fi
          CODE=$?
          cat .tmp/parse.log
          if [ $CODE -ne 0 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # 入库前自检：安全回归（恶意标题/题目不得以可执行形式进入产物）
      - name: 入库前安全自检
        run: node scripts/test-security.js

      - name: 写入课程数据
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # 课程文件不存在时用 Issue 标题兜底建课（去掉 [批量]/[题目] 前缀）
          TITLE=$(printf '%s' "$ISSUE_TITLE" | sed -E 's/^\[[^]]*\][[:space:]]*//')
          if [ -f .tmp/batch.json ]; then
            node scripts/add-question.js --json .tmp/batch.json --title "$TITLE"
          else
            node scripts/add-question.js --json .tmp/q.json --title "$TITLE"
          fi
          node scripts/build-index.js
          node scripts/check-data.js

      - name: 生成 PR 说明
        run: |
          {
            echo "由投稿自动生成，来源：#${{ github.event.issue.number }}"
            echo
            echo "Closes #${{ github.event.issue.number }}"
            echo
            echo '### 本次入库'
            echo '```'
            cat .tmp/parse.log
            echo '```'
            echo
            echo "- 审核内容指纹：\`$(sha256sum .tmp/issue.md | cut -c1-12)\`"
            echo "  （Issue 若在审核后被再次编辑，正文会变、指纹对不上，请重新核对）"
            echo
            echo '### 合并前请确认'
            echo '- [ ] 答案正确，与教材/课件一致'
            echo '- [ ] 解析讲得通，不是只重复答案'
            echo '- [ ] 出处真实可查'
            echo '- [ ] 不含他人课件原文、不含学生个人信息'
            echo
            echo '合并后页面会自动更新。'
          } > .tmp/pr-body.md

      - name: 校验失败时回帖说明
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let msg = '这条投稿暂时无法自动入库，需要人工处理。';
            for (const f of ['.tmp/parse.log']) {
              if (fs.existsSync(f)) {
                const t = fs.readFileSync(f, 'utf8').trim();
                if (t) msg = '这条投稿还需要改一下：\n\n```\n' + t + '\n```\n\n按上面提示修改后，让维护者重新加 `approved` 标签即可。';
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg
            });

      - name: 生成 PR
        if: success()
        id: cpr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: contribute/issue-${{ github.event.issue.number }}
          delete-branch: true
          commit-message: '投稿 #${{ github.event.issue.number }}：新增题目'
          title: '投稿 #${{ github.event.issue.number }}：${{ github.event.issue.title }}'
          labels: contribution
          body-path: .tmp/pr-body.md

      - name: 回帖告知 PR 地址
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_NUM: ${{ steps.cpr.outputs.pull-request-number }}
        with:
          script: |
            const fs = require('fs');
            const url = process.env.PR_URL;
            const num = process.env.PR_NUM;
            if (!url) {
              core.info('没有创建新 PR（可能内容无变化），跳过回帖');
              return;
            }
            let summary = '';
            try {
              summary = fs.readFileSync('.tmp/parse.log', 'utf8').trim().split('\n').slice(0, 16).join('\n');
            } catch (e) {}
            const tail = summary ? '\n\n解析结果：\n```\n' + summary + '\n```\n' : '\n';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `已生成 PR #${num}：${url}` + tail + '\n合并后即刻生效；如果有题目被跳过，按上面提示改好后可以另开一条投稿。'
            });
