<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--oc-course-route-->
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>传感器与检测技术 · 刷题</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OC 题库">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="toast" id="toast"><span id="ti">✕</span><span id="tt">答错了</span></div>

<header class="hd">
  <div class="hdin">
    <div class="row1">
      <div class="ttl"><a class="back" href="index.html">← 全部课程</a><b id="cname">加载中…</b><span id="cterm" class="cterm"></span></div>
      <div class="tools">
        <button class="btn" id="btnShuffle">随机</button>
        <button class="btn" id="btnWrong">错题 <b id="wrongN">0</b></button>
        <button class="btn plain" id="btnReset">重置</button>
      </div>
    </div>
    <div class="row2">
      <div class="track"><i id="bar"></i></div>
      <div class="stat" id="stat">已答 <b>0</b>/0 · 正确率 —</div>
    </div>
    <div class="srcbar" id="srcbar"></div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main id="list"></main>
<button class="fab" id="fab" title="跳到下一道未答">↓</button>

<script>window.OC_COURSE_ID = "sensor";</script>
<script src="data/_status.js"></script>
<script src="data/courses.js"></script>
<script>
(function(){
  var id = window.OC_COURSE_ID || new URLSearchParams(location.search).get('course') || 'sensor';
  /* 文件名与课程 id 解耦：优先用索引里的 file 字段 */
  var hit = (window.OC_COURSES || []).filter(function(c){ return c.id === id; })[0];
  var file = (hit && hit.file) ? hit.file : (id + '.js');
  var d = document.createElement('script');
  d.src = 'data/' + file + (window.OC_V ? '?v=' + window.OC_V : '');
  d.onload = function(){
    var s = document.createElement('script');
    s.src = 'assets/quiz.js';
    s.onerror = function(){ fail('脚本加载失败'); };
    document.body.appendChild(s);
  };
  d.onerror = function(){ fail('没有找到课程数据：' + id); };
  function fail(msg){
    var el = document.getElementById('list');
    if(el) el.innerHTML = '<div class="empty">' + msg + '<br><a href="index.html">返回全部课程</a></div>';
  }
  document.head.appendChild(d);
})();
</script>
<script src="assets/pwa.js"></script>
<script>
function cards(){ return document.querySelectorAll('.card').length; }
function chips(){ return [].slice.call(document.querySelectorAll('#chips .chip')).map(function(c){ return c.textContent.replace(/\s+/g,''); }).join(' '); }
setTimeout(function(){
  var out = [];
  out.push('大类按钮=' + document.querySelectorAll('.kchip').length + ' 个：' + [].slice.call(document.querySelectorAll('.kchip')).map(function(b){return b.textContent;}).join('/'));
  var sel = document.querySelector('select[data-sel="doc"]');
  out.push('资料下拉选项=' + (sel ? sel.options.length : 0));
  out.push('初始卡片=' + cards() + ' | chips: ' + chips());

  var bookBtn = [].slice.call(document.querySelectorAll('.kchip')).filter(function(b){return b.textContent==='课本';})[0];
  bookBtn.click();
  setTimeout(function(){
    out.push('点「课本」后卡片=' + cards() + ' | chips: ' + chips());
    var sel2 = document.querySelector('select[data-sel="doc"]');
    out.push('资料下拉(课本范围)=' + [].slice.call(sel2.options).map(function(o){return o.textContent;}).join(' / '));

    var anyBtn = [].slice.call(document.querySelectorAll('.kchip')).filter(function(b){return b.textContent==='全部';})[0];
    anyBtn.click();
    setTimeout(function(){
      var sel3 = document.querySelector('select[data-sel="doc"]');
      sel3.value = 'ppt-2026';
      sel3.dispatchEvent(new Event('change', {bubbles:true}));
      setTimeout(function(){
        out.push('选 PPT 资料后卡片=' + cards() + ' | chips: ' + chips());
        var d = document.createElement('pre'); d.id='dbg'; d.textContent = out.join('\n'); document.body.appendChild(d);
      }, 350);
    }, 300);
  }, 300);
}, 1200);
</script></body>
</html>
