<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>英语四级 · 背单词</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="vocab">

<header class="hd">
  <div class="hdin">
    <div class="row1">
      <div class="ttl"><a class="back" href="index.html">← 全部课程</a><b>英语四级 · 背单词</b><span class="cterm" id="vday"></span></div>
      <div class="tools" data-fish="toggle-slot"></div>
    </div>
    <div class="row2">
      <div class="track"><i id="bar"></i></div>
      <div class="stat" id="stat">—</div>
    </div>
  </div>
</header>

<main class="wrap vwrap">

  <!-- ============ 今日 ============ -->
  <section class="vtoday">
    <div class="vthead">
      <h2>今天</h2>
      <span class="muted" id="todayTip"></span>
    </div>

    <div id="dueBox">
      <h3 class="vsub">按遗忘曲线要复习 <b id="dueCount">0</b> 课</h3>
      <ul class="duelist" id="dueList"></ul>
      <p class="muted vempty" id="dueEmpty" hidden>今天没有到期复习，可以学新课。</p>
    </div>

    <div class="vnewbox">
      <div class="vnewline">
        <span>下一课：<b id="nextLesson">—</b></span>
        <button class="btn primary" id="btnLearn">开始学这一课</button>
      </div>
      <div class="vnewline">
        <span class="muted">已经自己背过了？</span>
        <button class="btn plain" id="btnPick">勾选今天学过的课</button>
      </div>
    </div>
  </section>

  <!-- ============ 勾选面板 ============ -->
  <section class="vpanel2" id="pickBox" hidden>
    <div class="vpanel2-hd">
      <b>今天背了哪几课？</b>
      <span class="muted">点方块多选，确认后按遗忘曲线排复习</span>
    </div>
    <div class="units" id="pickUnits"></div>
    <div class="vrow">
      <button class="btn primary" id="btnPickOk">确认（<span id="pickN">0</span> 课）</button>
      <button class="btn plain" id="btnPickCancel">取消</button>
    </div>
  </section>

  <!-- ============ 学单词（卡片） ============ -->
  <section id="study" hidden>
    <div class="vstudy-hd">
      <b id="studyTitle">—</b>
      <span class="muted" id="studyProgress"></span>
      <button class="btn plain" id="btnStudyExit">退出</button>
    </div>

    <div class="vcard" id="vcard">
      <div class="vinner">
        <div class="vface vfront">
          <div class="vtag" id="vtag">单词</div>
          <div class="ven" id="ven">—</div>
          <div class="vph" id="vph"></div>
          <div class="vhint">点一下卡片看释义</div>
        </div>
        <div class="vface vback">
          <div class="vtag">释义</div>
          <div class="vzh" id="vzh">—</div>
          <div class="vmeta" id="vmeta"></div>
        </div>
      </div>
    </div>

    <div class="vbtns" id="vbtns" hidden>
      <button class="vbtn bad" data-k="no">不认识<small>记一笔</small></button>
      <button class="vbtn mid" data-k="fuzzy">模糊<small>过一遍</small></button>
      <button class="vbtn ok" data-k="yes">认识<small>下一个</small></button>
    </div>

    <div class="vdone" id="vdone" hidden>
      <div class="vdone-emoji">✅</div>
      <h3 id="vdoneTitle">这一课过完了</h3>
      <p class="muted" id="vdoneText"></p>
      <button class="btn primary" id="btnNextBatch" hidden>继续下一批</button>
      <button class="btn primary" id="btnFinish">记下今天学过，排复习</button>
      <button class="btn plain" id="btnFinishSkip">先不记</button>
    </div>
  </section>

  <!-- ============ 课程表 ============ -->
  <section class="vplan">
    <div class="vthead">
      <h2>课程表</h2>
      <span class="muted">12 单元 × 4 课 · 共 48 课</span>
    </div>
    <div class="legend">
      <i class="lg lg-new"></i>未学
      <i class="lg lg-due"></i>待复习
      <i class="lg lg-done"></i>已完成
      <i class="lg lg-wait"></i>本轮已复习
      <i class="lg lg-empty"></i>没有单词
    </div>
    <div class="units" id="units"></div>
  </section>

  <!-- ============ 添加单词 ============ -->
  <details class="vpanel" id="panel">
    <summary>添加单词 <span class="muted">（内置词库外的补充）</span></summary>
    <div class="vpanel-body">
      <p class="seedinfo" id="seedInfo"></p>
      <label class="vlabel">批量粘贴，每行一个：<code>apple 苹果</code> 或 <code>apple,苹果</code> 或 <code>apple /ˈæpl/ 苹果</code></label>
      <textarea id="bulk" rows="6" placeholder="abandon 放弃&#10;ability /əˈbɪləti/ 能力&#10;absorb,吸收"></textarea>
      <div class="vrow">
        <button class="btn" id="btnBulk">导入这些单词</button>
        <span class="muted" id="bulkHint"></span>
      </div>

      <hr class="vhr">

      <label class="vlabel">单条录入</label>
      <div class="vform">
        <input id="fEn" placeholder="英文（必填）" autocomplete="off">
        <input id="fZh" placeholder="中文释义（必填）" autocomplete="off">
        <input id="fPh" placeholder="音标（可选）" autocomplete="off">
        <button class="btn" id="btnOne">添加</button>
      </div>

      <div class="vrow">
        <span class="muted">自建单词每课上限</span>
        <select id="fPer" class="srcsel">
          <option value="20">20</option>
          <option value="25" selected>25</option>
          <option value="30">30</option>
          <option value="50">50</option>
        </select>
        <span class="muted" id="capTip"></span>
      </div>
    </div>
  </details>

  <!-- ============ 词库 ============ -->
  <details class="vpanel">
    <summary>我的词库 <span class="muted" id="bankCount">0 词</span></summary>
    <div class="vpanel-body">
      <div class="vrow">
        <button class="btn plain" id="btnExport">导出 JSON</button>
        <button class="btn plain" id="btnClear">清空词库</button>
        <span class="muted">数据只存在你的浏览器里</span>
      </div>
      <ul class="vwords" id="vwords"></ul>
    </div>
  </details>

</main>

<script src="assets/vocab-cet4.js"></script>
<script src="assets/fish.js"></script>
<script src="assets/vocab.js"></script>
<script src="assets/pwa.js"></script>
</body>
</html>
